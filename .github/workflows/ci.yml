name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust exporter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The runner ships a stable toolchain; rustfmt and clippy are components
      # of it, so no third-party action is needed here.
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked

  python:
    name: Python package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      # Pinned by major version; pin the commit SHA to tighten the supply chain.
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest